[package]
name = "wired"
version = "0.1.0"
edition = "2021"
description = "Wire Desk — autonomous multi-agent AI operations, defensive security auditing, and task orchestration engine."
authors = ["Wire Desk <engineering@wire-desk.example>"]
license = "Apache-2.0"
repository = "https://github.com/etherlancer1/wire-desk"
readme = "../../README.md"

[[bin]]
name = "wired"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# HTTP server (Axum) + Tokio runtime, tuned for low RAM.
axum = { version = "0.7", features = ["json", "sse"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }
tower-http = { version = "0.5", features = ["cors", "timeout", "limit", "trace", "compression"] }

# Serialization / validation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite persistence (rusqlite) called via tokio::task::spawn_blocking.
rusqlite = { version = "0.31", features = ["chrono", "bundled", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# CLI argument parsing (clap derive).
clap = { version = "4", features = ["derive"] }

# Structured logging + request/trace id propagation.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }

# Async HTTP client for LLM providers and safe fetches (used inside spawn_blocking or with a client pool).
reqwest = { version = "0.11", features = ["json", "timeout", "gzip"] }

# Auth: JWT session tokens + Argon2id password hashing.
jsonwebtoken = "8"
argon2 = "0.5"

# Cryptography: HMAC-SHA256 for webhook signing/verification.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Error handling.
thiserror = "1"
async-trait = "0.1"

# Utilities.
once_cell = "1"
rand = "0.8"
dotenvy = "0.15"

[dev-dependencies]
anyhow = "1"
tempfile = "3"

[profile.release]
opt-level = 2
codegen-units = 2
panic = "abort"
strip = true
lto = false

[profile.dev]
opt-level = 0
